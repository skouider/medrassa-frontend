<div class="bg-[#f8faf9] min-h-screen py-10" dir="rtl">
  <div class="container text-center">
    <h1 class="display-5 fw-bold text-[#064e3b] mb-4">مرحباً بكم في منصة التسجيل</h1>
    <p class="lead text-muted mb-5">يرجى اختيار البرنامج المطلوب للبدء في عملية التسجيل</p>
    
    <div class="row justify-content-center g-4">
      <div class="col-md-5">
        <div class="card h-100 border-0 shadow-sm rounded-4 hover-scale p-4" 
         (click)="selectPath('coran')">
          <span class="display-1 mb-3">📖</span>
          <h3 class="fw-bold text-[#064e3b]">المدرسة القرآنية</h3>
          <p class="text-muted">حفظ وتجويد القرآن الكريم لجميع المستويات</p>
          <button class="btn btn-outline-success rounded-pill mt-3">اختيار</button>
        </div>
      </div>
      <div class="col-md-5">
        <div class="card h-100 border-0 shadow-sm rounded-4 hover-scale p-4"
         (click)="selectPath('prep')">
          <span class="display-1 mb-3">🎓</span>
          <h3 class="fw-bold text-[#064e3b]">الأقسام التحضيرية</h3>
          <p class="text-muted">إعداد الأطفال للمسار الدراسي مع تربية إسلامية</p>
          <button class="btn btn-outline-success rounded-pill mt-3">اختيار</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- ***************************************************** -->

<!-- Modal -->
<div
  *ngIf="showModal"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
>

  <div class="bg-white rounded-2xl shadow-xl p-6 w-[90%] max-w-md text-center">

    <div class="text-5xl mb-4">
      ⚠️
    </div>

    <h2 class="text-xl font-bold text-red-600 mb-4">
      تنبيه
    </h2>

    <p class="text-gray-700 mb-6">
      {{ messageModal }}
    </p>

    <button
      (click)="showModal = false"
      class="bg-green-700 hover:bg-green-800 text-white px-6 py-2 rounded-full"
    >
      حسناً
    </button>

  </div>

</div>
