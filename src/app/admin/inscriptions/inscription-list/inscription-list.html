  </div>


  <div class="table-responsive">

<table class="table table-striped table-hover text-center align-middle">

  <thead>

    <tr>

      <th>اللقب</th>

      <th>الاسم</th>

      <th>العمر</th>

      <th>تاريخ التسجيل</th>

      <th>حالة التسجيل</th>

      <th>الإجراءات</th>

    </tr>

  </thead>


  <tbody>

    <tr
      *ngFor="let i of inscriptions$ | async"
      (click)="_selectedInscription(i)"
      style="cursor: pointer;">

      <td>
        {{ i.nom }}
      </td>

      <td>
        {{ i.prenom }}
      </td>

      <td>
        {{ i.age }}
      </td>

      <td>
        {{ i.dateInscription }}
      </td>


      <td>

        <span
          class="badge"
          [ngClass]="{
            'bg-success': i.statut === 'VALIDEE',
            'bg-warning text-dark': i.statut === 'LISTE_ATTENTE',
            'bg-danger': i.statut === 'REFUSEE',
            'bg-secondary': i.statut === 'ANNULEE',
            'bg-info text-dark': i.statut === 'EN_ATTENTE'
          }">

          <span *ngIf="i.statut === 'VALIDEE'">
            مقبول
          </span>

          <span *ngIf="i.statut === 'LISTE_ATTENTE'">
            في قائمة الانتظار
          </span>

          <span *ngIf="i.statut === 'REFUSEE'">
            مرفوض
          </span>

          <span *ngIf="i.statut === 'ANNULEE'">
            ملغى
          </span>

          <span *ngIf="i.statut === 'EN_ATTENTE'">
            في انتظار المعالجة
          </span>

        </span>

      </td>


      <td>

        <button
          type="button"
          class="btn btn-sm btn-outline-primary"
          (click)="showDetail(i); $event.stopPropagation()">

          <i
            class="fa-solid"
            [ngClass]="
              showInscriptionDetail &&
              inscriptionSelectionnee.id === i.id
                ? 'fa-eye-slash'
                : 'fa-eye'
            ">
          </i>

          <span
            *ngIf="
              showInscriptionDetail &&
              inscriptionSelectionnee.id === i.id
            ">
            إخفاء التفاصيل
          </span>

          <span
            *ngIf="
              !showInscriptionDetail ||
              inscriptionSelectionnee.id !== i.id
            ">
            التفاصيل
          </span>

        </button>

      </td>

    </tr>


    <tr *ngIf="(inscriptions$ | async)?.length === 0">

      <td
        colspan="6"
        class="text-muted text-center py-4">

        لا يوجد أي تسجيل

      </td>

    </tr>

  </tbody>

</table>

  </div>

  <div class="card-footer">

<div class="d-flex justify-content-between align-items-center">

  <button
    class="btn btn-outline-success"
    type="button"
    (click)="previous()"
    [disabled]="page === 0">

    <i class="fa-solid fa-chevron-right"></i>
    السابق

  </button>


  <span class="fw-bold">

    الصفحة {{ page + 1 }}
    من
    {{ totalPages }}

  </span>


  <button
    class="btn btn-outline-success"
    type="button"
    (click)="next()"
    [disabled]="page + 1 >= totalPages">

    التالي
    <i class="fa-solid fa-chevron-left"></i>

  </button>

</div>

  </div>


  <div
    class="col-12 mt-3"
    *ngIf="showInscriptionDetail">

<app-inscription-detail
  (close)="fermerDetail()">
</app-inscription-detail>

  </div>

</div>
